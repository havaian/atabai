  # Frontend Production Server
  frontend-prod:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: production
      args:
        - VITE_API_BASE_URL=${VITE_API_BASE_URL:-https://atabai.uz/api}
        - VITE_APP_TITLE=${VITE_APP_TITLE:-ATABAI}
        - VITE_APP_DESCRIPTION=${VITE_APP_DESCRIPTION:-Excel Automation Platform for IFRS}
        - VITE_GOOGLE_CLIENT_ID=${VITE_GOOGLE_CLIENT_ID}
    container_name: ${PROJECT_NAME:-atabai}-frontend-prod
    restart: unless-stopped
    volumes:
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "${FRONTEND_EXPOSE:-127.0.0.1:80}:${FRONTEND_PROD_PORT}"
    # depends_on:
    #   - backend
    networks:
      - atabai-network
    # profiles: ["prod"]
