  # Redis Cache
  redis:
    image: redis:7.2-alpine
    container_name: ${PROJECT_NAME:-atabai}-redis
    restart: unless-stopped
    # Expose REDIS_PASSWORD to the container shell so the healthcheck below
    # can reach it via $$REDIS_PASSWORD (single $ in container, $$ to escape
    # compose's own interpolation). Without this, the healthcheck would run
    # `redis-cli -a "" ping`, get NOAUTH, exit non-zero, and the container
    # would be flagged unhealthy even though redis itself is fully up.
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-password}
    # No --port: redis listens on its default 6379 inside the container, which
    # is what the backend reaches via `redis:6379` over the docker network.
    command: redis-server --requirepass ${REDIS_PASSWORD:-password} --appendonly yes
    volumes:
      - redis_data:/data
    # No `ports:` - redis is only reachable from inside the compose network.
    # To connect from the host for debugging, run a one-shot client in the
    # same network:
    #   docker compose exec redis redis-cli -a "$REDIS_PASSWORD"
    networks:
      - atabai-network
    healthcheck:
      # $$REDIS_PASSWORD → compose passes it through as $REDIS_PASSWORD →
      # container shell expands it from the `environment:` block above.
      # --no-auth-warning silences "using -a is insecure" stderr noise.
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  # Backend API Server
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      - JWT_SECRET=${JWT_SECRET}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
      - REDIS_ENABLED=true
    container_name: ${PROJECT_NAME:-atabai}-backend
    restart: unless-stopped
    env_file: 
      - .env
    volumes:
      - ./backend/public:/app/public
      - ./uploads:/uploads:rw,Z
      - ./logs:/app/logs
    ports:
      - "${BACKEND_EXPOSE:-127.0.0.1:3000}:${BACKEND_PORT}"
    depends_on:
    #   mongodb:
    #     condition: service_healthy
      redis:
        condition: service_healthy
    #   rabbitmq:
    #     condition: service_healthy
    networks:
      - atabai-network
    healthcheck:
      # Hit the same port the app actually listens on - BACKEND_PORT from .env.
      # The previous value (3000) was hard-coded and didn't match the .env's
      # 7770, which is why this container kept reporting "unhealthy" even when
      # it was serving fine. Using wget because curl isn't in the node:alpine
      # base image; CMD-SHELL so the env var expands.
      test: ["CMD-SHELL", "wget -qO- http://localhost:${BACKEND_PORT}/health > /dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 256M

